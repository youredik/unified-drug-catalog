packages:
  - packages/*
  - apps/*

# S7 — цепочка поставок. После червя Shai-Hulud (796 пакетов, 132 млн загрузок
# в месяц) свежеопубликованная версия не ставится, пока не отлежится.
minimumReleaseAge: 10080 # минут = 7 суток; pnpm применяет и к транзитивным

# ─── Известные уязвимости: две политики безопасности столкнулись ─────────────
#
# `pnpm audit` в CI стоит на `high` и обязан валить прогон. Сейчас он находит
# два advisory, и обновиться до исправленных версий НЕЛЬЗЯ: исправления
# опубликованы 5 суток назад и не проходят карантин выше. Тот самый случай,
# когда защита от компрометации пакета мешает закрыть уязвимость в пакете.
#
# Решение — не понижать порог гейта и не отключать карантин, а записать
# точечное исключение с обоснованием и сроком:
#
#   GHSA-mh99-v99m-4gvg  brace-expansion  DoS через раскрытие скобок
#     путь: @testcontainers/postgresql → testcontainers → archiver → glob
#     достижимость: только интеграционные тесты, в прод-код не входит
#
#   GHSA-67mh-4wv8-2f99  esbuild  dev-сервер отвечает на любой запрос
#     путь: drizzle-kit → @esbuild-kit/esm-loader
#     достижимость: только генерация миграций локально, dev-сервер не поднимаем
#
# Обе цепочки — инструменты сборки и тестов; ни одна не попадает в код,
# который исполняется над данными поставщика. Снять исключение после
# 04.08.2026, когда исправленные версии пройдут карантин: удалить блок
# ниже и выполнить `pnpm update`.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    - GHSA-67mh-4wv8-2f99
